# .github/dependabot.yml — generated by gatekeeper.
# Source: 2-modern-python (references/dependabot.md, security-setup.md).

version: 2
updates:
  # Python dependencies (pyproject.toml, uv.lock, requirements.txt).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Supply-chain protection: do not adopt a release younger than
    # 7 days, so a compromised version is usually caught before it
    # reaches this project.
    cooldown:
      default-days: 7
    # One PR per update type instead of one PR per package.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [patch]

  # The workflows themselves: an action pinned to an old tag is a supply-chain risk.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
